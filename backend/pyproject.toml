[project]
name = "trado-backend"
version = "0.1.0"
description = "FastAPI backend and async worker for Hyperliquid trading signals"
requires-python = ">=3.11"
dependencies = [
  # Versions pinned to the snapshot used during the security/architecture
  # hardening pass. Bump intentionally (one library at a time) and verify
  # `pytest` is still green before relaxing or upgrading any of these.
  "fastapi==0.136.1",
  "uvicorn[standard]==0.46.0",
  "sqlalchemy==2.0.49",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "httpx==0.28.1",
  "python-dotenv==1.2.2",
  "structlog==25.5.0",
  "websockets==16.0",
  "pywebpush==2.3.0",
  "hyperliquid-python-sdk==0.23.0",
  "alembic==1.18.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.12",
  "mypy==2.0.0",
  # Supply chain hygiene: run `pip-audit` in CI to scan pinned versions for
  # CVEs and review reports before bumping anything.
  "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
